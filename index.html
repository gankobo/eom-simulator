<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>外眼筋作用シミュレータ</title>
    <link rel="stylesheet" href="./src/app/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="canvas-wrap"></div>
      <aside id="panel">
        <h1>外眼筋作用シミュレータ</h1>
        <p class="sub">眼位依存の6筋作用（Tier0 kinematic / Tier1 string model）</p>
        <p><a href="./listing.html">Listing 則 と half-angle 則の3D解説 →</a></p>

        <section>
          <div class="row">
            <label>眼</label>
            <select id="eye">
              <option value="OD">右眼 (OD)</option>
              <option value="OS">左眼 (OS)</option>
            </select>
            <label>モデル</label>
            <select id="tier">
              <option value="string">Tier1 string（精密）</option>
              <option value="kinematic">Tier0 kinematic（簡易）</option>
            </select>
          </div>
        </section>

        <section>
          <div class="slider">
            <label>水平 <span id="hval">0</span>°（+内転 / −外転）</label>
            <input id="h" type="range" min="-50" max="50" value="0" step="1" />
          </div>
          <div class="slider">
            <label>垂直 <span id="vval">0</span>°（+上転 / −下転）</label>
            <input id="v" type="range" min="-50" max="50" value="0" step="1" />
          </div>
          <div class="row">
            <button data-gaze="0,0">第一眼位</button>
            <button data-gaze="-23,0">外転23°</button>
            <button data-gaze="51,0">内転51°</button>
          </div>
        </section>

        <section>
          <label>表示する筋</label>
          <div id="muscle-toggles" class="toggles"></div>
        </section>

        <section>
          <h2>作用（現在の眼位）</h2>
          <table id="action-table">
            <thead>
              <tr><th>筋</th><th>回旋</th><th>上下転</th><th>水平</th><th>長(mm)</th></tr>
            </thead>
            <tbody></tbody>
          </table>
          <p class="note">回旋: +外旋/−内旋　上下: +下転/−上転　水平: +内転/−外転</p>
        </section>
      </aside>
    </div>
    <script type="module" src="./src/app/main.ts"></script>
  </body>
</html>
